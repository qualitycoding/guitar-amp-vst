name: ci

on:
  push:
    branches: [ impl-*, main, master ]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        config: [ Release ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build plugin
        run: cmake --build build --config ${{ matrix.config }} --target GrimAmp_VST3

      - name: Build AU (macOS only)
        if: runner.os == 'macOS'
        run: cmake --build build --config ${{ matrix.config }} --target GrimAmp_AU

      - name: Build tests + bench
        run: cmake --build build --config ${{ matrix.config }} --target grimamp_tests grimamp_bench

      - name: Verify JUCE submodule pin
        shell: bash
        run: |
          git -C JUCE rev-parse HEAD | tee juce-head.txt
          grep -q "ea77444750de45e036e0279bb0291144bf8e3688" juce-head.txt \
            || (echo "JUCE submodule hash drifted from pin" && exit 1)

      - name: Freeze manifest check
        shell: bash
        run: sha256sum -c tests/FROZEN_MANIFEST.sha256

      - name: ctest (frozen unit + DSP suite)
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

      - name: pluginval strictness 5 (VST3)
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: ${{ github.workspace }}/build/GrimAmp_artefacts/${{ matrix.config }}/VST3/GrimAmp.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
          args: --timeout-ms 180000

      - name: Register AU (macOS only)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/GrimAmp_artefacts/${{ matrix.config }}/AU/GrimAmp.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/GrimAmp.component
          if pgrep -x AudioComponentRegistrar >/dev/null; then killall -9 AudioComponentRegistrar; fi

      - name: pluginval strictness 5 (AU, macOS only)
        if: runner.os == 'macOS'
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: /Users/runner/Library/Audio/Plug-Ins/Components/GrimAmp.component
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
          args: --timeout-ms 180000

      # --- T-041: local file handling only -------------------------------
      - name: Security grep — file I/O confined to preset/IR modules
        shell: bash
        run: |
          ! grep -rn --include=*.h --include=*.cpp -E "File(InputStream|OutputStream)::|createInputStream|createOutputStream|loadFileAsString|createReaderFor" \
              Source/ \
              | grep -v "Source/Presets/" \
              | grep -v "Source/DSP/UserIRLoader" \
              | grep -v "Source/DSP/CabIR.h"
          echo "T-041 pass"

      # --- T-040: no network ---------------------------------------------
      - name: Security check — no curl / no sockets
        shell: bash
        run: |
          grep -rn --include=CMakeLists.txt --include=*.h --include=*.cpp -E "JUCE_USE_CURL=0" CMakeLists.txt Source/ tests/
          ! grep -rn --include=*.h --include=*.cpp -E "juce::(URL|Socket|StreamingSocket)" Source/ tests/
          echo "T-040 static pass (import-table check runs on binaries below on Windows)"

      - name: T-040 import-table check (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          BIN="build/GrimAmp_artefacts/${{ matrix.config }}/VST3/GrimAmp.vst3/Contents/x86_64-win/GrimAmp.vst3"
          [ -f "$BIN" ] || BIN=$(find build -name "GrimAmp.vst3" -path "*VST3*" | head -1)
          # Rule 14 (D-001p): no swallowed failures — a missing binary or a failed
          # dumpbin must fail the step, not vacuously pass the grep below.
          [ -n "$BIN" ] && [ -f "$BIN" ] || { echo "VST3 binary not found"; exit 1; }
          dumpbin //imports "$BIN" | tee imports.txt
          ! grep -iE "ws2_32|wininet|winhttp|libcurl" imports.txt
          echo "T-040 windows pass"

      - name: Benchmark (renders; gates are applied by the next step)
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }} -R bench

      # Rule 14 / A-3..A-5: T-051 latency and the per-runner-class T-050 budget and regression
      # gates (tests/bench/bench-targets.json, baseline-T050.json). The macOS budget is relaxed by
      # maintainer decision D-001n and only reported. The script always writes a baseline candidate.
      - name: Check bench gates (T-050 / T-051)
        shell: bash
        run: |
          python3 tools/ci/check_bench.py --runner ${{ matrix.os }} \
              --results build/tests/bench-results.json \
              --candidate-out build/tests/bench-baseline-candidate.json

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}
          path: |
            build/tests/bench-results.json
            build/tests/bench-baseline-candidate.json
          if-no-files-found: error

  lint-ci:
    # Rule 14: the workflows themselves must not swallow failures; the linters must be able to fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint self-tests (the checks can fail)
        run: |
          python3 tools/ci/lint_ci.py --selftest
          python3 tools/ci/check_bench.py --selftest
      - name: Lint workflows for failure-swallowing idioms
        run: python3 tools/ci/lint_ci.py

  sanitize:
    # AddressSanitizer + UBSan over the fast test subset: catches the off-by-one and
    # out-of-bounds reads that mutation testing cannot distinguish (reviews/MUTATION.md).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE Linux dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
              libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build tests with ASan + UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_CXX_FLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-asan --target grimamp_tests

      - name: Run tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -o pipefail
          ./build-asan/tests/grimamp_tests \
              skeleton param_inventory param_ranges sine_sanity harmonics preset_roundtrip \
              state_restore smoothing gestures ir_loading \
              boost_reference gate_reference tonestack_reference poweramp_reference \
              cabir_selection userir_loader preset_list 2>&1 | tee asan.log

      - name: Fuzz presets under sanitizers (T-013 corpus, seed 42)
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -o pipefail
          python3 tests/fuzz_preset.py --seed 42 --count 1000 --out-dir build-asan/fuzz_corpus \
              --seed-preset Resources/presets/preset01.xml
          GRIMAMP_FUZZ_DIR=$PWD/build-asan/fuzz_corpus ./build-asan/tests/grimamp_tests fuzz_presets 2>&1 | tee -a asan.log

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Mull 0.34.x line: package, plugin path and clang major must agree (K-20261027T123200Z)
      - name: Install Mull + clang 19
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y mull-19 clang-19 lld-19 libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build test suite with Mull instrumentation (-O0)
        run: |
          cmake -B build-mull -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
                -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
                -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-19"
          cmake --build build-mull --target grimamp_tests

      # Every mutant re-runs the test executable, so only the fast tests are used (D-001l):
      # silence (T-004) and denormals (T-007) take ~18 s each in Release and fuzz_presets
      # (T-013) needs the ctest-generated corpus.
      - name: Run Mull (T-070, floor 75 %)
        timeout-minutes: 330
        run: |
          set -o pipefail
          mull-runner-19 --report-name mull --reporters SQLite --reporters IDE \
              --workers 4 --timeout 900000 --minimum-timeout 120000 \
              --allow-surviving \
              ./build-mull/tests/grimamp_tests \
              skeleton param_inventory param_ranges sine_sanity harmonics preset_roundtrip \
              state_restore smoothing gestures ir_loading \
              boost_reference gate_reference tonestack_reference poweramp_reference \
              cabir_selection userir_loader preset_list 2>&1 | tee mull.log

      - name: Mutation score gate (T-070, floor 75 %)
        run: |
          python3 - <<'PY'
          import sqlite3, sys
          rows = sqlite3.connect('mull.sqlite').execute('select execution_status from mutant').fetchall()
          total = len(rows)
          survived = sum(1 for (s,) in rows if s == 2)  # 2 = Passed, i.e. the mutant survived
          score = 100.0 * (total - survived) / total
          print(f'Mutation score: {score:.1f}% ({total - survived}/{total} killed); floor 75%')
          sys.exit(0 if score >= 75.0 else 1)
          PY

      - name: Upload Mull report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-report
          path: |
            mull.sqlite
            mull.log
          if-no-files-found: error
