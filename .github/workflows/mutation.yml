# T-070 mutation testing, three tiers (skill: mutation-testing-in-ci, qualitycoding/skills), sharded by source file (D-001ak).
#   Tier 1  pull_request / push : only the changed in-scope files (a change to the tests or to the mutation
#           config widens it to every file); reports "not-applicable" when no mutable file changed.
#   Tier 2  schedule            : every file. GitHub only runs schedules from the default branch's copy of this file.
#   Tier 3  workflow_dispatch   : every file or only changed files on demand.
# One job per source file keeps a runaway mutant from taking the whole run down: the unsharded runs of 2026-11-05
# were cancelled at the 240-minute limit and then lost their hosted runner after 3 h 40 min (D-001ai, D-001aj).
# `mutation-gate` is the only job meant to be a required status check. There is deliberately no `paths:`
# filter here: a path-filtered workflow never runs when nothing matches, and a required check would stay pending.
name: mutation

on:
  pull_request:
  push:
    branches: [ impl-*, main, master ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'full or incremental'
        default: 'full'

permissions:
  contents: read
  issues: write          # used only to report a failed scheduled run

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0

      - name: Decide scope (full, incremental or not-applicable) and list the files to mutate
        id: scope
        shell: bash
        run: |
          set -o pipefail
          event="${{ github.event_name }}"
          # every mutable source file: the shard list for a full run
          git ls-files 'Source/DSP/*' 'Source/Presets/*' | grep -E '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' > all.txt
          mode=""
          if [ "$event" = "schedule" ] || { [ "$event" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" != "incremental" ]; }; then
            mode=full
          else
            base="${{ github.event.pull_request.base.sha || github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-list --max-parents=0 HEAD | tail -1)      # unknown base: compare with the first commit (large diff)
            fi
            git diff --name-only "$base"...HEAD > changed.txt
            # a change to the tests that kill mutants, or to the mutation config, can change any file's score
            if grep -E '^(tests/|mull\.yml$|tools/ci/mull_)' changed.txt > /dev/null; then
              mode=full
            elif python3 tools/ci/mull_include_paths.py --scope 'Source/DSP/' --scope 'Source/Presets/' \
                   --base mull.yml --out /dev/null < changed.txt > kept.txt; then
              mode=incremental
            else
              mode=not-applicable
            fi
          fi
          if [ "$mode" = "incremental" ]; then cp kept.txt files.txt; else cp all.txt files.txt; fi
          # only files that have mutants get a shard: those in the recorded baseline (Voicings.h, UserIRLoader.h and
          # PresetManager.h hold data or declarations only; a shard without mutants would find no report). A new
          # mutable file has to be added to reviews/mutation-baseline.json by a full run before it is gated.
          python3 - <<'PY'
          import json
          base = set(json.load(open("reviews/mutation-baseline.json")))
          files = [l.strip() for l in open("files.txt") if l.strip()]
          kept = [f for f in files if f in base]
          for f in files:
              if f not in base:
                  print("::notice::no mutants expected, not mutated: " + f)
          open("files.txt", "w").write("\n".join(kept) + ("\n" if kept else ""))
          PY
          if [ ! -s files.txt ]; then mode=not-applicable; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "files=$(python3 -c 'import json; print(json.dumps([l.strip() for l in open("files.txt") if l.strip()]))')" >> "$GITHUB_OUTPUT"
          echo "mode: $mode"; cat files.txt

  mutate:
    needs: [scope]
    if: needs.scope.outputs.mode != 'not-applicable'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.scope.outputs.files) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Name this shard
        id: shard
        shell: bash
        run: echo "name=$(echo '${{ matrix.file }}' | tr '/.' '__')" >> "$GITHUB_OUTPUT"

      - name: Write the mutation config for this file only
        shell: bash
        run: |
          set -o pipefail
          echo '${{ matrix.file }}' | python3 tools/ci/mull_include_paths.py --scope 'Source/DSP/' --scope 'Source/Presets/' \
              --base mull.yml --out mull.run.yml
          cp mull.run.yml mull.yml          # Mull reads mull.yml from the working tree at compile and run time
          cat mull.yml

      # Mull 0.34.x line: package, plugin path and clang major must agree (K-20261027T123200Z)
      - name: Install Mull + clang 19
        run: |
          # The Cloudsmith apt repository answered 402 Payment Required on 2026-11-05 (D-001ag), so the same Mull 0.34 line
          # is installed from its GitHub release package, which is built against LLVM 19.1.1 (Ubuntu 24.04's clang-19).
          curl -fsSL --retry 4 -o mull.deb 'https://github.com/mull-project/mull/releases/download/0.34.2/Mull-19-0.34.2-LLVM-19.1.1-ubuntu-amd64-24.04.deb'
          sudo apt-get update
          sudo apt-get install -y ./mull.deb clang-19 lld-19 libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Build test suite with Mull instrumentation (-O0)
        run: |
          cmake -B build-mull -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 \
                -DCMAKE_CXX_FLAGS="-O0 -g -grecord-command-line -fpass-plugin=/usr/lib/mull-ir-frontend-19" \
                -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld-19"
          cmake --build build-mull --target grimamp_tests

      # Every mutant re-runs the test executable, so only the fast tests are used (D-001l):
      # silence (T-004) and denormals (T-007) take ~18 s each in Release and fuzz_presets
      # (T-013) needs the ctest-generated corpus.
      # Each process is capped (D-001ak): 6 GB of address space and 20 CPU minutes. A mutant that loops or allocates
      # without bound then dies alone and is counted as killed, instead of starving the hosted runner.
      - name: Run Mull (T-070)
        shell: bash
        run: |
          set -o pipefail
          ulimit -v 6291456
          ulimit -t 1200
          mull-runner-19 --report-name mull --reporters SQLite --reporters IDE \
              --workers 3 --timeout 900000 --minimum-timeout 120000 \
              --allow-surviving \
              ./build-mull/tests/grimamp_tests \
              skeleton param_inventory param_ranges sine_sanity harmonics preset_roundtrip \
              state_restore smoothing gestures ir_loading \
              boost_reference gate_reference tonestack_reference poweramp_reference posteq_reference biquad_design retune_equivalence \
              cabir_selection userir_loader preset_list 2>&1 | tee mull.log

      - name: Upload Mull report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: mull-${{ steps.shard.outputs.name }}
          path: |
            mull.sqlite
            mull.log
          if-no-files-found: error

      - name: Open an issue when the scheduled run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Nightly mutation run failed" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  mutation-gate:
    # The required status check. Always runs and fails unless every shard passed and the combined score passes;
    # "not-applicable" (no mutable file changed) is a pass that says so.
    if: always()
    needs: [scope, mutate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4

      - name: Check the shards
        shell: bash
        run: |
          mode="${{ needs.scope.outputs.mode }}"
          scope_result="${{ needs.scope.result }}"
          mutate_result="${{ needs.mutate.result }}"
          echo "scope: $scope_result ($mode), mutate: $mutate_result"
          [ "$scope_result" = "success" ]
          if [ "$mode" = "not-applicable" ]; then echo "No mutable source files changed: mutation testing is not applicable to this change."; exit 0; fi
          [ "$mutate_result" = "success" ]

      - name: Download the shard reports
        if: needs.scope.outputs.mode != 'not-applicable'
        uses: actions/download-artifact@v4
        with:
          pattern: mull-*
          path: reports

      # Floor 75 % (T-070) for the project score on a full run. An incremental run is gated per file against the
      # scores recorded from the last full run (reviews/mutation-baseline.json, tolerance 5 points): some files
      # score below the project floor with justified survivors (reviews/MUTATION.md).
      - name: Mutation score gate (T-070)
        if: needs.scope.outputs.mode != 'not-applicable'
        shell: bash
        run: |
          set -o pipefail
          ls reports/*/mull.sqlite
          if [ "${{ needs.scope.outputs.mode }}" = "incremental" ]; then
            python3 tools/ci/mull_score.py reports/*/mull.sqlite --floor 75 --baseline reviews/mutation-baseline.json \
                --tolerance 5 --min-mutants 1 --strip 'guitar-amp-vst/' | tee score.txt
          else
            python3 tools/ci/mull_score.py reports/*/mull.sqlite --floor 75 --min-mutants 150 --strip 'guitar-amp-vst/' | tee score.txt
          fi

      - name: Upload the score
        if: always() && needs.scope.outputs.mode != 'not-applicable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: score
          path: score.txt
          if-no-files-found: ignore
